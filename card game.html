<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brain Matcher 🧠 - Arcade Edition</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
      --glass-bg: rgba(30, 41, 59, 0.75);
      --glass-border: rgba(255, 255, 255, 0.15);
      --accent-neon: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.5);
      --text-color: #f8fafc;
      --danger-color: #ef4444;
      --success-color: #22c55e;
      --gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 15px;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Particle Canvas */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 90;
    }

    /* Page Navigation System */
    .page {
      display: none;
      width: 100%;
      max-width: 600px;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Common Card Box Styling */
    .panel-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 15px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--accent-neon);
      text-shadow: 0 0 12px var(--accent-glow);
      margin-bottom: 8px;
    }

    h2 {
      font-size: 1.4rem;
      color: var(--text-color);
      margin-bottom: 15px;
    }

    /* Buttons */
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    button:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    button.btn-gold {
      background-color: #d97706;
    }

    button.btn-gold:hover {
      background-color: #b45309;
      box-shadow: 0 6px 20px rgba(217, 119, 6, 0.4);
    }

    button.btn-secondary {
      background-color: #475569;
    }

    button.btn-secondary:hover {
      background-color: #334155;
    }

    button.btn-danger {
      background-color: #dc2626;
    }

    button.btn-danger:hover {
      background-color: #b91c1c;
    }

    /* PAGE 1: GAMER PROFILE PAGE */
    .profile-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .avatar-large {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      border: 3px solid var(--accent-neon);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .input-group {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 320px;
      margin-top: 8px;
    }

    .input-group input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.8);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin: 15px 0;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-box .val {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-neon);
    }

    .stat-box .lbl {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin-top: 15px;
    }

    .avatar-item {
      position: relative;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid #334155;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .avatar-item.active {
      border-color: var(--accent-neon);
      background: rgba(30, 58, 138, 0.6);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .avatar-item.locked .icon {
      filter: blur(4px);
      opacity: 0.4;
    }

    .avatar-item .lock-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.4rem;
    }

    .avatar-item .icon { font-size: 2.2rem; }
    .avatar-item .cost { font-size: 0.75rem; color: var(--gold); font-weight: bold; }

    /* PAGE 2: LEVEL SELECTOR PAGE */
    .level-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 15px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      width: 100%;
      max-height: 60vh;
      overflow-y: auto;
      padding-right: 5px;
    }

    .level-grid::-webkit-scrollbar {
      width: 6px;
    }
    .level-grid::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
    }

    .level-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      transition: all 0.2s ease;
      min-height: 65px;
    }

    .level-btn.unlocked {
      border-color: var(--accent-neon);
      background: rgba(30, 58, 138, 0.4);
    }

    .level-btn.unlocked:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .level-btn.locked {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #1e293b;
    }

    .level-btn .stars {
      font-size: 0.65rem;
      margin-top: 4px;
      color: var(--gold);
    }

    /* PAGE 3: GAMEPLAY PAGE */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
    }

    .stats-bar {
      display: flex;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      margin-bottom: 10px;
    }

    .powerups-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .powerup-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .powerup-btn:hover {
      background: var(--accent-neon);
      color: #000;
    }

    /* --- ENHANCED & INCREASED BLOCK / CARD SIZES --- */
    .game-grid-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      max-height: 60vh;
      overflow-y: auto;
      padding: 10px 0;
    }

    .game-grid {
      display: grid;
      gap: 10px;
      perspective: 1000px;
      justify-content: center;
      align-items: center;
      margin: auto;
    }

    .card {
      aspect-ratio: 1;
      background-color: transparent;
      border: none;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
      /* LARGER CARD BLOCKS: Scaled up for clarity */
      width: clamp(48px, 12vw, 85px);
      height: clamp(48px, 12vw, 85px);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Larger font inside card blocks */
      font-size: clamp(1.4rem, 4vw, 2.6rem);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .card-front {
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid var(--glass-border);
    }

    .card-front::after {
      content: "🧠";
      font-size: clamp(1rem, 2.5vw, 1.8rem);
      opacity: 0.7;
    }

    .card-back {
      background: #1e1b4b;
      border: 2px solid var(--accent-neon);
      box-shadow: inset 0 0 12px var(--accent-glow);
      transform: rotateY(180deg);
    }

    /* Hint Highlight Effect */
    .card.hint-active .card-front {
      border: 3px solid var(--gold);
      box-shadow: 0 0 20px var(--gold);
      animation: hintPulse 0.8s infinite alternate;
    }

    @keyframes hintPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .card.shake .card-back {
      border-color: var(--danger-color);
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      20%, 60% { transform: rotateY(180deg) translateX(-6px); }
      40%, 80% { transform: rotateY(180deg) translateX(6px); }
    }

    .card.combining {
      transform: rotateY(180deg) scale(0.2);
      opacity: 0;
      pointer-events: none;
    }

    .card.matched-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .game-controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      justify-content: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <!-- ================= PAGE 1: GAMER PROFILE ================= -->
  <div class="page active" id="page-profile">
    <div class="panel-card">
      <h1>Brain Matcher 🧠</h1>
      <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 15px;">Welcome! Set up your Profile & Avatar</p>

      <div class="profile-hero">
        <div class="avatar-large" id="profile-avatar-display">🧒</div>
        <div class="input-group">
          <input type="text" id="player-name-input" placeholder="Enter Name" maxlength="12">
          <button onclick="savePlayerName()">Save</button>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="val" id="profile-coins">🪙 0</div>
          <div class="lbl">Coins</div>
        </div>
        <div class="stat-box">
          <div class="val" id="profile-highscore">0</div>
          <div class="lbl">High Score</div>
        </div>
        <div class="stat-box">
          <div class="val" id="profile-level-max">1</div>
          <div class="lbl">Level Reached</div>
        </div>
      </div>

      <button class="btn-gold" style="width: 100%; padding: 14px; font-size: 1.1rem; margin-top: 5px;" onclick="navigateTo('page-levels')">
        🎮 PLAY GAME / SELECT LEVEL
      </button>
    </div>

    <!-- Avatar Shop Panel -->
    <div class="panel-card">
      <h2>🛍️ Unlock & Select Avatars</h2>
      <div class="avatar-grid" id="avatar-grid"></div>
      
      <button class="btn-danger" style="margin-top: 20px; font-size: 0.8rem;" onclick="resetAllData()">
        ⚠️ Clear All Progress Data
      </button>
    </div>
  </div>


  <!-- ================= PAGE 2: LEVEL SELECTOR ================= -->
  <div class="page" id="page-levels">
    <div class="panel-card">
      <div class="level-header">
        <button class="btn-secondary" onclick="navigateTo('page-profile')">⬅️ Profile</button>
        <h2>Select Level</h2>
        <div style="font-size: 0.9rem; color: var(--gold); font-weight: bold;">🪙 <span id="levels-page-coins">0</span></div>
      </div>

      <div class="level-grid" id="level-grid-container"></div>
    </div>
  </div>


  <!-- ================= PAGE 3: GAMEPLAY VIEW ================= -->
  <div class="page" id="page-game">
    <div class="panel-card" style="padding: 15px;">
      <div class="game-header">
        <button class="btn-secondary" onclick="navigateTo('page-levels')">🗺️ Levels</button>
        <div style="font-weight: bold; color: var(--accent-neon);" id="current-level-badge">Level 1</div>
        <button class="btn-secondary" id="sound-toggle" onclick="toggleSound()">🔊 ON</button>
      </div>

      <div class="stats-bar">
        <div>⏱️ Time: <span id="timer">180</span>s</div>
        <div>⭐ Score: <span id="score">0</span></div>
        <div>🪙 Coins: <span id="game-coins">0</span></div>
        <div>Moves: <span id="moves">0</span></div>
      </div>

      <!-- Power-Ups -->
      <div class="powerups-bar">
        <button class="powerup-btn" onclick="usePowerup('hint')">💡 Hint (🪙15)</button>
        <button class="powerup-btn" onclick="usePowerup('peek')">👁️ Peek (🪙30)</button>
        <button class="powerup-btn" onclick="usePowerup('freeMatch')">🎯 Match (🪙50)</button>
        <button class="powerup-btn" onclick="usePowerup('freeze')">🧊 Freeze (🪙25)</button>
      </div>

      <!-- Game Grid Container (Increased Block Sizes) -->
      <div class="game-grid-wrapper">
        <div class="game-grid" id="grid"></div>
      </div>

      <div class="game-controls">
        <button class="btn-danger" onclick="retryLevel()">🔄 Retry Level</button>
      </div>
    </div>
  </div>

  <script>
    // --- Emoji & Avatar Data ---
    const emojiPool = [
      '🧠', '⚡', '🚀', '💡', '🎮', '🎯', '🔮', '🔥', '🌟', '👾',
      '🤖', '👑', '💎', '🎨', '🍕', '🐱', '🐶', '🦊', '🦁', '🐸',
      '🐵', '🦄', '🐝', '🐙', '🦖', '⚽', '🏀', '🚗', '✈️', '⛵',
      '⏰', '📱', '💻', '📷', '🎁', '🎈', '🔑', '❤️', '🍀', '🌈',
      '🍔', '🍟', '🍩', '🍦', '🍒', '🍉', '🥑', '🌮', '🍿', '🍣'
    ];

    const avatarShop = [
      { id: 'avatar_kid', icon: '🧒', price: 0 },
      { id: 'avatar_fox', icon: '🦊', price: 50 },
      { id: 'avatar_wolf', icon: '🐺', price: 100 },
      { id: 'avatar_bear', icon: '🐻', price: 150 },
      { id: 'avatar_tiger', icon: '🐯', price: 200 },
      { id: 'avatar_lion', icon: '🦁', price: 300 },
      { id: 'avatar_panda', icon: '🐼', price: 400 },
      { id: 'avatar_penguin', icon: '🐧', price: 500 },
      { id: 'avatar_chick', icon: '🐥', price: 750 }
    ];

    // Saved Game States
    let playerName = 'Guest';
    let activeAvatar = '🧒';
    let unlockedAvatars = ['🧒'];
    let coins = 0;
    let score = 0;
    let highScore = 0;
    let maxUnlockedLevel = 1;
    let levelStars = {};

    // Current Game Runtime State
    let currentLevel = 1;
    let moves = 0;
    let totalPairs = 0;
    let matchedPairs = 0;
    let flippedCards = [];
    let timeLeft = 180;
    let timerInterval = null;
    let gameStarted = false;
    let soundEnabled = true;

    // Canvas Confetti
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function triggerConfetti(x, y) {
      const colors = ['#38bdf8', '#f59e0b', '#22c55e', '#ec4899', '#a855f7'];
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: x || canvas.width / 2,
          y: y || canvas.height / 2,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10 - 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          radius: Math.random() * 5 + 2,
          life: 1
        });
      }
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2;
        p.life -= 0.02;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fill();

        if (p.life <= 0) particles.splice(index, 1);
      });
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    // Sound System
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const c = getAudioContext();
        if (type === 'flip') {
          const osc = c.createOscillator(); const gain = c.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(450, c.currentTime);
          osc.frequency.exponentialRampToValueAtTime(180, c.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, c.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, c.currentTime + 0.05);
          osc.connect(gain); gain.connect(c.destination);
          osc.start(); osc.stop(c.currentTime + 0.05);
        } else if (type === 'match') {
          [523, 659, 783].forEach((f, i) => {
            const osc = c.createOscillator(); const gain = c.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(f, c.currentTime + i * 0.07);
            gain.gain.setValueAtTime(0.15, c.currentTime + i * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + i * 0.07 + 0.2);
            osc.connect(gain); gain.connect(c.destination);
            osc.start(c.currentTime + i * 0.07); osc.stop(c.currentTime + i * 0.07 + 0.2);
          });
        } else if (type === 'mismatch') {
          const osc = c.createOscillator(); const gain = c.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, c.currentTime);
          osc.frequency.exponentialRampToValueAtTime(110, c.currentTime + 0.2);
          gain.gain.setValueAtTime(0.15, c.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, c.currentTime + 0.2);
          osc.connect(gain); gain.connect(c.destination);
          osc.start(); osc.stop(c.currentTime + 0.2);
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊 ON' : '🔇 OFF';
    }

    // Page Router
    function navigateTo(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');

      if (pageId === 'page-levels') renderLevelGrid();
      if (pageId === 'page-profile') renderAvatarShop();
      updateUI();
    }

    // Save & Load Data
    function loadSavedData() {
      const savedName = localStorage.getItem('bm_p_name');
      const savedAvatar = localStorage.getItem('bm_p_avatar');
      const savedUnlocked = localStorage.getItem('bm_p_unlocked');
      const savedCoins = localStorage.getItem('bm_p_coins');
      const savedScore = localStorage.getItem('bm_p_score');
      const savedHigh = localStorage.getItem('bm_p_high');
      const savedMaxLvl = localStorage.getItem('bm_p_maxlvl');
      const savedStars = localStorage.getItem('bm_p_stars');

      if (savedName) playerName = savedName;
      if (savedAvatar) activeAvatar = savedAvatar;
      if (savedUnlocked) unlockedAvatars = JSON.parse(savedUnlocked);
      if (savedCoins) coins = parseInt(savedCoins, 10);
      if (savedScore) score = parseInt(savedScore, 10);
      if (savedHigh) highScore = parseInt(savedHigh, 10);
      if (savedMaxLvl) maxUnlockedLevel = parseInt(savedMaxLvl, 10);
      if (savedStars) levelStars = JSON.parse(savedStars);

      updateUI();
    }

    function saveData() {
      localStorage.setItem('bm_p_name', playerName);
      localStorage.setItem('bm_p_avatar', activeAvatar);
      localStorage.setItem('bm_p_unlocked', JSON.stringify(unlockedAvatars));
      localStorage.setItem('bm_p_coins', coins);
      localStorage.setItem('bm_p_score', score);
      localStorage.setItem('bm_p_high', Math.max(score, highScore));
      localStorage.setItem('bm_p_maxlvl', maxUnlockedLevel);
      localStorage.setItem('bm_p_stars', JSON.stringify(levelStars));
      updateUI();
    }

    function resetAllData() {
      if (confirm('⚠️ Erase all progress, coins, and levels?')) {
        localStorage.clear();
        playerName = 'Guest'; activeAvatar = '🧒'; unlockedAvatars = ['🧒'];
        coins = 0; score = 0; highScore = 0; maxUnlockedLevel = 1; levelStars = {};
        saveData();
        navigateTo('page-profile');
      }
    }

    function savePlayerName() {
      const val = document.getElementById('player-name-input').value.trim();
      if (val) {
        playerName = val;
        saveData();
        alert('Profile name updated!');
      }
    }

    function updateUI() {
      document.getElementById('player-name-input').value = playerName;
      document.getElementById('profile-avatar-display').textContent = activeAvatar;
      document.getElementById('profile-coins').textContent = '🪙 ' + coins;
      document.getElementById('profile-highscore').textContent = Math.max(score, highScore);
      document.getElementById('profile-level-max').textContent = maxUnlockedLevel;
      document.getElementById('levels-page-coins').textContent = coins;
      document.getElementById('game-coins').textContent = coins;
      document.getElementById('score').textContent = score;
    }

    // Avatar Shop Render
    function renderAvatarShop() {
      const container = document.getElementById('avatar-grid');
      container.innerHTML = '';

      avatarShop.forEach(item => {
        const isUnlocked = unlockedAvatars.includes(item.icon);
        const isActive = activeAvatar === item.icon;

        const el = document.createElement('div');
        el.className = `avatar-item ${isActive ? 'active' : ''} ${!isUnlocked ? 'locked' : ''}`;
        el.innerHTML = `
          <div class="icon">${item.icon}</div>
          ${!isUnlocked ? '<div class="lock-overlay">🔒</div>' : ''}
          <div class="cost">${isUnlocked ? (isActive ? 'Active' : 'Equip') : '🪙 ' + item.price}</div>
        `;

        el.onclick = () => {
          if (isUnlocked) {
            activeAvatar = item.icon;
            saveData();
            renderAvatarShop();
          } else {
            if (coins >= item.price) {
              if (confirm(`Unlock ${item.icon} avatar for 🪙 ${item.price}?`)) {
                coins -= item.price;
                unlockedAvatars.push(item.icon);
                activeAvatar = item.icon;
                saveData();
                renderAvatarShop();
              }
            } else {
              alert(`Not enough coins! Earn more by beating levels.`);
            }
          }
        };
        container.appendChild(el);
      });
    }

    // PAGE 2: Level Selector Renderer
    function renderLevelGrid() {
      const container = document.getElementById('level-grid-container');
      container.innerHTML = '';

      for (let i = 1; i <= 150; i++) {
        const isUnlocked = i <= maxUnlockedLevel;
        const stars = levelStars[i] || '';

        const btn = document.createElement('div');
        btn.className = `level-btn ${isUnlocked ? 'unlocked' : 'locked'}`;
        btn.innerHTML = `
          <div>${isUnlocked ? i : '🔒'}</div>
          <div class="stars">${stars}</div>
        `;

        if (isUnlocked) {
          btn.onclick = () => startLevel(i);
        }
        container.appendChild(btn);
      }
    }

    // Level Configs
    function getGridConfig(level) {
      if (level <= 10) return { cols: 4, rows: 4, totalCards: 16, pairs: 8 };
      if (level <= 25) return { cols: 6, rows: 6, totalCards: 36, pairs: 18 };
      if (level <= 50) return { cols: 7, rows: 7, totalCards: 48, pairs: 24 };
      if (level <= 100) return { cols: 8, rows: 8, totalCards: 64, pairs: 32 };
      return { cols: 10, rows: 10, totalCards: 100, pairs: 50 };
    }

    function getTimeForLevel(level) {
      return Math.max(60, 180 - Math.floor((level - 1) * 0.8));
    }

    function startLevel(lvl) {
      currentLevel = lvl;
      navigateTo('page-game');
      loadGameGrid();
    }

    function retryLevel() {
      stopTimer();
      loadGameGrid();
    }

    function stopTimer() {
      clearInterval(timerInterval);
      gameStarted = false;
    }

    function startTimer() {
      if (!gameStarted) {
        gameStarted = true;
        timerInterval = setInterval(() => {
          timeLeft--;
          document.getElementById('timer').textContent = timeLeft;

          if (timeLeft <= 0) {
            stopTimer();
            alert(`⏰ Time's up! Level ${currentLevel} failed.`);
            retryLevel();
          }
        }, 1000);
      }
    }

    // PAGE 3: Gameplay Logic
    function loadGameGrid() {
      stopTimer();
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      
      document.getElementById('moves').textContent = moves;
      document.getElementById('current-level-badge').textContent = `Level ${currentLevel}`;
      
      timeLeft = getTimeForLevel(currentLevel);
      document.getElementById('timer').textContent = timeLeft;

      const config = getGridConfig(currentLevel);
      totalPairs = config.pairs;

      const grid = document.getElementById('grid');
      grid.style.gridTemplateColumns = `repeat(${config.cols}, 1fr)`;
      grid.innerHTML = '';

      const selectedEmojis = emojiPool.slice(0, totalPairs);
      const deck = [...selectedEmojis, ...selectedEmojis].sort(() => Math.random() - 0.5);

      deck.forEach(emoji => {
        const card = document.createElement('button');
        card.className = 'card';
        card.dataset.emoji = emoji;
        card.innerHTML = `
          <div class="card-face card-front"></div>
          <div class="card-face card-back">${emoji}</div>
        `;
        card.onclick = () => flipCard(card);
        grid.appendChild(card);
      });
    }

    function flipCard(card) {
      startTimer();

      if (flippedCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('combining')) {
        return;
      }

      playSound('flip');
      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        document.getElementById('moves').textContent = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [c1, c2] = flippedCards;

      if (c1.dataset.emoji === c2.dataset.emoji) {
        playSound('match');
        const rect = c2.getBoundingClientRect();
        triggerConfetti(rect.left + rect.width/2, rect.top + rect.height/2);

        matchedPairs++;
        score += 15 + Math.floor(timeLeft / 10);
        saveData();

        setTimeout(() => {
          c1.classList.add('combining');
          c2.classList.add('combining');
        }, 300);

        setTimeout(() => {
          c1.classList.add('matched-hidden');
          c2.classList.add('matched-hidden');
          flippedCards = [];

          if (matchedPairs === totalPairs) {
            stopTimer();
            triggerConfetti();

            let stars = '⭐';
            if (timeLeft > getTimeForLevel(currentLevel) * 0.6) stars = '⭐⭐⭐';
            else if (timeLeft > getTimeForLevel(currentLevel) * 0.3) stars = '⭐⭐';

            levelStars[currentLevel] = stars;
            const earnedCoins = 15 + Math.floor(currentLevel * 1.2);
            coins += earnedCoins;

            if (currentLevel === maxUnlockedLevel && maxUnlockedLevel < 150) {
              maxUnlockedLevel++;
            }

            saveData();

            setTimeout(() => {
              alert(`🎉 Level ${currentLevel} Cleared!\nRating: ${stars}\nCoins Earned: 🪙 +${earnedCoins}`);
              navigateTo('page-levels');
            }, 300);
          }
        }, 600);

      } else {
        playSound('mismatch');
        c1.classList.add('shake');
        c2.classList.add('shake');

        setTimeout(() => {
          c1.classList.remove('flipped', 'shake');
          c2.classList.remove('flipped', 'shake');
          flippedCards = [];
        }, 600);
      }
    }

    // Power-ups Mechanics
    function usePowerup(type) {
      if (type === 'hint') {
        if (coins >= 15) {
          const unfulfilled = Array.from(document.querySelectorAll('.card:not(.matched-hidden):not(.flipped)'));
          if (unfulfilled.length >= 2) {
            coins -= 15;
            saveData();
            const target = unfulfilled[Math.floor(Math.random() * unfulfilled.length)];
            target.classList.add('hint-active');
            alert('💡 Hint: Highlighted card holds a match!');
            setTimeout(() => target.classList.remove('hint-active'), 3000);
          }
        } else alert('Need 🪙 15!');
      } else if (type === 'peek') {
        if (coins >= 30) {
          coins -= 30;
          saveData();
          const hidden = document.querySelectorAll('.card:not(.flipped):not(.matched-hidden)');
          hidden.forEach(c => c.classList.add('flipped'));
          setTimeout(() => hidden.forEach(c => {
            if (!flippedCards.includes(c)) c.classList.remove('flipped');
          }), 1500);
        } else alert('Need 🪙 30!');
      } else if (type === 'freeMatch') {
        if (coins >= 50) {
          const unfulfilled = Array.from(document.querySelectorAll('.card:not(.matched-hidden)'));
          let pair = null;
          for (let i = 0; i < unfulfilled.length; i++) {
            for (let j = i + 1; j < unfulfilled.length; j++) {
              if (unfulfilled[i].dataset.emoji === unfulfilled[j].dataset.emoji) {
                pair = [unfulfilled[i], unfulfilled[j]];
                break;
              }
            }
            if (pair) break;
          }
          if (pair) {
            coins -= 50;
            saveData();
            pair[0].classList.add('flipped');
            pair[1].classList.add('flipped');
            flippedCards = pair;
            checkMatch();
          }
        } else alert('Need 🪙 50!');
      } else if (type === 'freeze') {
        if (coins >= 25) {
          coins -= 25;
          saveData();
          stopTimer();
          alert('🧊 Timer frozen for 7 seconds!');
          setTimeout(() => { if (timeLeft > 0) startTimer(); }, 7000);
        } else alert('Need 🪙 25!');
      }
    }

    // Initialization
    loadSavedData();
  </script>
</body>
</html>
